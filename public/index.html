<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deriv Trading Server</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 20px; }
  .container { max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .row { display: flex; flex-wrap: wrap; gap: 15px; margin: 12px 0; }
  .col { flex: 1; min-width: 200px; }
  label { display: block; font-weight: bold; margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 12px 24px; margin: 5px; cursor: pointer; font-weight: bold; border: none; border-radius: 4px; }
  .btn-start { background: #4CAF50; color: white; }
  .btn-stop { background: #f44336; color: white; }
  .btn-auto { background: #2196F3; color: white; }
  .btn-auto-stop { background: #f44336; color: white; }
  .btn-start:disabled, .btn-stop:disabled, .btn-auto:disabled, .btn-auto-stop:disabled { opacity: 0.5; cursor: not-allowed; }
  .stats { display: flex; gap: 20px; margin: 15px 0; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 180px; background: #e3f2fd; padding: 12px; border-radius: 6px; text-align: center; }
  .stat-value { font-size: 22px; font-weight: bold; color: #1565c0; }
  .profit-positive { color: #2e7d32; }
  .profit-negative { color: #c62828; }
  #logs { background: #1e1e1e; color: #0f0; height: 320px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 13px; border-radius: 4px; margin-top: 20px; }
  .log-entry { margin: 2px 0; border-bottom: 1px solid #333; padding: 2px 0; }
  .status-running { color: #2e7d32; font-weight: bold; }
  .status-stopped { color: #c62828; font-weight: bold; }
  .section-title { font-size: 20px; font-weight: bold; margin: 20px 0 10px; border-top: 1px solid #ccc; padding-top: 15px; }
  .auto-info { background: #e8f5e9; padding: 12px; border-radius: 6px; margin: 10px 0; }
  .cooldown { background: #fff3e0; padding: 12px; border-radius: 6px; color: #e65100; font-weight: bold; }
  .hidden { display: none; }
  .tick-box { font-size: 28px; background: #000; color: #0f0; padding: 5px 15px; border-radius: 6px; font-family: monospace; }
  .last-digit { font-size: 36px; font-weight: bold; margin-top: 5px; }
</style>
</head>
<body>
<div class="container">
  <h2>Deriv Trading Server</h2>

  <div class="stats">
    <div class="stat-box"><div>Status</div><div class="stat-value" id="serverStatus">Connecting...</div></div>
    <div class="stat-box"><div>Account Balance</div><div class="stat-value" id="balanceDisplay">--</div></div>
    <div class="stat-box"><div>Manual P/L</div><div class="stat-value" id="profitDisplay">0.00</div></div>
  </div>

  <div class="stats">
    <div class="stat-box" style="background:#fff3e0;">
      <div>Current Tick (formatted)</div>
      <div class="tick-box" id="tickPrice">--</div>
    </div>
    <div class="stat-box" style="background:#fce4ec;">
      <div>Last Digit</div>
      <div class="last-digit" id="lastDigit">-</div>
    </div>
  </div>

  <!-- Manual Trading Configuration -->
  <div class="section-title">Manual Trading</div>
  <div class="row">
    <div class="col">
      <label>Market Symbol</label>
      <select id="marketSymbol">
        <option value="R_10">V10 (dp=3)</option>
        <option value="R_25">V25 (dp=3)</option>
        <option value="R_50">V50 (dp=4)</option>
        <option value="R_75">V75 (dp=4)</option>
        <option value="R_100" selected>V100 (dp=2)</option>
      </select>
    </div>
    <div class="col">
      <label>Trigger Mode</label>
      <select id="triggerMode">
        <option value="single" selected>Single Digit</option>
        <option value="cluster">Cluster Digits</option>
      </select>
    </div>
  </div>

  <div id="singleDigitsBlock" class="row">
    <div class="col">
      <label>Trigger Digits (comma, empty=all)</label>
      <input type="text" id="triggerDigits" placeholder="e.g. 1,2,3" value="5">
    </div>
  </div>
  <div id="clusterDigitsBlock" class="row hidden">
    <div class="col">
      <label>Cluster Digits</label>
      <input type="text" id="clusterDigits" value="0,1,2,3">
    </div>
    <div class="col">
      <label>Cluster Size</label>
      <input type="number" id="clusterSize" min="2" max="10" value="2">
    </div>
  </div>

  <div class="row">
    <div class="col"><label>Direction</label>
      <select id="directionOverUnder">
        <option value="over" selected>DIGITOVER</option>
        <option value="under">DIGITUNDER</option>
      </select>
    </div>
    <div class="col"><label>Barrier Digit</label><input type="number" id="barrierDigit" value="3"></div>
    <div class="col"><label>Stake</label><input type="number" id="stake" step="0.01" value="1.00"></div>
    <div class="col"><label>Martingale</label><input type="number" id="martingale" step="0.1" value="2.0"></div>
    <div class="col"><label>Take Profit</label><input type="number" id="takeProfit" step="0.01" value="10.00"></div>
    <div class="col"><label>Stop Loss</label><input type="number" id="stopLoss" step="0.01" value="10.00"></div>
  </div>
  <div>
    <button class="btn-start" id="startBtn" onclick="startManual()">▶ Start Manual</button>
    <button class="btn-stop" id="stopBtn" onclick="stopManual()" disabled>⏹ Stop Manual</button>
  </div>

  <!-- Auto‑Trading Section -->
  <div class="section-title">Auto‑Trading (Confidence)</div>
  <div class="auto-info" id="autoStatusPanel">
    <strong>Auto‑trader:</strong> <span id="autoStatusText">Stopped</span><br>
    <span id="autoSignalInfo">No signal</span><br>
    <span id="autoSessionProfit">Session profit: 0.00</span><br>
    <span id="dailyPnLInfo">Daily P&L: 0.00</span>
  </div>
  <div>
    <button class="btn-auto" id="autoStartBtn" onclick="startAuto()">🤖 Start Auto‑Trading</button>
    <button class="btn-auto-stop" id="autoStopBtn" onclick="stopAuto()" disabled>⏹ Stop Auto‑Trading</button>
  </div>

  <div class="section-title">Trade Logs</div>
  <div id="logs"></div>
</div>

<script>
const logDiv = document.getElementById('logs');
const es = new EventSource('/api/logs');
es.onmessage = e => {
  const data = JSON.parse(e.data);
  if (data.logs) {
    data.logs.forEach(l => {
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.textContent = `[${new Date(l.time).toLocaleTimeString()}] ${l.message}`;
      logDiv.insertBefore(div, logDiv.firstChild);
      while (logDiv.children.length > 200) logDiv.removeChild(logDiv.lastChild);
    });
  }
  if (data.state) updateUI(data.state);
};

function updateUI(s) {
  // Keep manual config fields only set from /api/state once
  if (s.balance) document.getElementById('balanceDisplay').textContent = `${parseFloat(s.balance).toFixed(2)} ${s.currency || 'USD'}`;
  if (s.active !== undefined) {
    document.getElementById('serverStatus').textContent = s.active ? 'Manual Running' : 'Manual Stopped';
    document.getElementById('serverStatus').className = s.active ? 'status-running' : 'status-stopped';
    document.getElementById('startBtn').disabled = s.active;
    document.getElementById('stopBtn').disabled = !s.active;
  }
  if (s.runningProfit !== undefined) {
    const profit = parseFloat(s.runningProfit).toFixed(2);
    const el = document.getElementById('profitDisplay');
    el.textContent = profit;
    el.className = profit >= 0 ? 'profit-positive' : 'profit-negative';
  }
  if (s.formattedPrice) {
    document.getElementById('tickPrice').textContent = s.formattedPrice;
    document.getElementById('lastDigit').textContent = s.lastDigit || '';
  }
  // Auto‑mode
  if (s.autoActive !== undefined) {
    document.getElementById('autoStartBtn').disabled = s.autoActive;
    document.getElementById('autoStopBtn').disabled = !s.autoActive;
    document.getElementById('autoStatusText').textContent = s.autoActive ? 'Running' : 'Stopped';
  }
  if (s.autoAnalysis) {
    document.getElementById('autoSignalInfo').textContent = `Signal: ${s.autoAnalysis.market} - ${s.autoAnalysis.direction} (conf. ${s.autoAnalysis.confidence}%)`;
  } else {
    document.getElementById('autoSignalInfo').textContent = 'No signal';
  }
  if (s.autoSessionProfit !== undefined) {
    document.getElementById('autoSessionProfit').textContent = `Session profit: ${parseFloat(s.autoSessionProfit).toFixed(2)}`;
  }
  if (s.dailyPnL !== undefined) {
    document.getElementById('dailyPnLInfo').textContent = `Daily P&L: ${parseFloat(s.dailyPnL).toFixed(2)}`;
  }
}

// Load config fields once
fetch('/api/state')
  .then(r => r.json())
  .then(s => {
    document.getElementById('marketSymbol').value = s.marketSymbol;
    document.getElementById('triggerMode').value = s.triggerMode;
    document.getElementById('triggerDigits').value = s.triggerDigits;
    document.getElementById('clusterDigits').value = s.clusterDigits;
    document.getElementById('clusterSize').value = s.clusterSize;
    document.getElementById('barrierDigit').value = s.barrierDigit;
    document.getElementById('directionOverUnder').value = s.directionOverUnder;
    document.getElementById('stake').value = s.stake;
    document.getElementById('martingale').value = s.martingale;
    document.getElementById('takeProfit').value = s.takeProfit;
    document.getElementById('stopLoss').value = s.stopLoss;
    toggleModeFields();
    // Also update all dynamic fields
    updateUI(s);
  });

function toggleModeFields() {
  const mode = document.getElementById('triggerMode').value;
  document.getElementById('singleDigitsBlock').classList.toggle('hidden', mode !== 'single');
  document.getElementById('clusterDigitsBlock').classList.toggle('hidden', mode !== 'cluster');
}
document.getElementById('triggerMode').addEventListener('change', toggleModeFields);

function startManual() {
  const payload = {
    marketSymbol: document.getElementById('marketSymbol').value,
    triggerMode: document.getElementById('triggerMode').value,
    triggerDigits: document.getElementById('triggerDigits').value,
    clusterDigits: document.getElementById('clusterDigits').value,
    clusterSize: parseInt(document.getElementById('clusterSize').value),
    directionOverUnder: document.getElementById('directionOverUnder').value,
    barrierDigit: document.getElementById('barrierDigit').value,
    stake: parseFloat(document.getElementById('stake').value),
    martingale: parseFloat(document.getElementById('martingale').value),
    takeProfit: parseFloat(document.getElementById('takeProfit').value),
    stopLoss: parseFloat(document.getElementById('stopLoss').value)
  };
  fetch('/api/control', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ action: 'update', ...payload })
  }).then(() => fetch('/api/control', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'start'}) }));
}

function stopManual() {
  fetch('/api/control', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'stop'}) });
}

function startAuto() {
  fetch('/api/auto', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'start'}) });
}

function stopAuto() {
  fetch('/api/auto', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'stop'}) });
}
</script>
</body>
</html>
