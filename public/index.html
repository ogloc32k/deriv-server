<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Professional Multi‑Market</title>
<style>
  body { font-family: Arial; background:#111; color:#eee; margin:20px; }
  .container { max-width:750px; margin:auto; }
  .stat { background:#222; padding:15px; border-radius:8px; margin:10px 0; }
  .big { font-size:28px; font-weight:bold; }
  .green { color:#4caf50; } .red { color:#f44336; } .orange { color:#ff9800; } .blue { color:#42a5f5; }
  .btn { padding:15px 30px; margin:5px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; }
  .btn-start { background:#4caf50; color:white; } .btn-stop { background:#f44336; color:white; }
  .btn:disabled { opacity:0.4; }
  #logs { background:#1a1a1a; height:300px; overflow-y:auto; padding:10px; font-family:monospace; font-size:13px; margin-top:20px; }
  .settings { display:flex; flex-wrap:wrap; gap:10px; }
  .settings label { display:block; margin-top:5px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { padding:6px; border-bottom:1px solid #333; text-align:center; }
  .highlight { background:#333; }
</style>
</head>
<body>
<div class="container">
  <h2>Professional Mode</h2>

  <div class="stat">
    <div>Balance: <span id="balance" class="big green">--</span></div>
    <div>Daily P&L: <span id="dailyPnl" class="big">--</span></div>
    <div>Active trades: <span id="activeCount" class="big orange">0</span></div>
    <div id="lockStatus" class="red" style="display:none;">⚠️ Daily limit reached – bot locked</div>
  </div>

  <div class="stat">
    <div class="settings">
      <label>Min Confidence % <input id="minConf" type="number" value="45" min="35" max="65"></label>
      <label>Risk % per trade <input id="riskPct" type="number" value="1.5" step="0.5"></label>
      <label>Daily Stop Loss % <input id="dailySL" type="number" value="6"></label>
      <label>Daily Take Profit % <input id="dailyTP" type="number" value="20"></label>
      <label>Max concurrent <input id="maxConc" type="number" value="2" min="1" max="3"></label>
      <label>Trend filter <input id="trendFilter" type="checkbox" checked></label>
    </div>
  </div>

  <div>
    <button class="btn btn-start" id="startBtn" onclick="start()">Start Trading</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stop()" disabled>Stop Trading</button>
  </div>

  <!-- Confidence display table -->
  <h3>Live Confidence</h3>
  <table>
    <tr><th>Market</th><th>Over %</th><th>Under %</th><th>Trend</th><th>Best</th></tr>
    <tbody id="signalTable">
      <!-- rows injected -->
    </tbody>
  </table>

  <h3>Logs</h3>
  <div id="logs"></div>
</div>

<script>
const es = new EventSource('/api/logs');
es.onmessage = e => {
  const data = JSON.parse(e.data);
  if (data.state) updateUI(data.state);
  if (data.logs) {
    const logDiv = document.getElementById('logs');
    data.logs.forEach(l => {
      const div = document.createElement('div');
      div.textContent = `[${new Date(l.time).toLocaleTimeString()}] ${l.message}`;
      logDiv.insertBefore(div, logDiv.firstChild);
    });
  }
};

const marketOrder = ['R_10','R_25','R_50','R_75','R_100'];

function updateUI(s) {
  document.getElementById('balance').textContent = s.balance ? `${parseFloat(s.balance).toFixed(2)} ${s.currency}` : '--';
  document.getElementById('dailyPnl').textContent = s.dailyPnl !== undefined ? `${s.dailyPnl.toFixed(2)} USD` : '--';
  document.getElementById('activeCount').textContent = s.activeTrades ? s.activeTrades.length : 0;
  document.getElementById('lockStatus').style.display = s.locked ? 'block' : 'none';
  document.getElementById('startBtn').disabled = s.active;
  document.getElementById('stopBtn').disabled = !s.active;

  // Update signal table
  const tbody = document.getElementById('signalTable');
  tbody.innerHTML = '';
  if (s.marketSignals) {
    for (const sym of marketOrder) {
      const sig = s.marketSignals[sym];
      if (!sig) continue;
      const tr = document.createElement('tr');
      const bestDir = sig.bestDirection === 'over' ? '↑' : (sig.bestDirection === 'under' ? '↓' : '');
      const trendIcon = sig.trend === 'up' ? '↑' : (sig.trend === 'down' ? '↓' : '→');
      tr.innerHTML = `<td>${sym}</td><td>${sig.over}%</td><td>${sig.under}%</td><td>${trendIcon}</td><td class="orange">${bestDir} ${sig.bestConf}%</td>`;
      tbody.appendChild(tr);
    }
  }
}

function start() {
  const config = {
    minConfidence: document.getElementById('minConf').value,
    riskPct: document.getElementById('riskPct').value,
    dailyStopLossPct: document.getElementById('dailySL').value,
    dailyTakeProfitPct: document.getElementById('dailyTP').value,
    maxConcurrent: document.getElementById('maxConc').value,
    trendFilterEnabled: document.getElementById('trendFilter').checked
  };
  fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'update', ...config})})
    .then(() => fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'start'})}));
}
function stop() {
  fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'stop'})});
}
</script>
</body>
</html>
