<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tick‑Based Virtual‑Loss Bot</title>
<style>
  body { font-family: Arial; background:#111; color:#eee; margin:20px; }
  .container { max-width:800px; margin:auto; }
  .stat { background:#222; padding:15px; border-radius:8px; margin:10px 0; }
  .big { font-size:28px; font-weight:bold; }
  .green { color:#4caf50; } .red { color:#f44336; } .orange { color:#ff9800; }
  .btn { padding:15px 30px; margin:5px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; }
  .btn-start { background:#4caf50; color:white; } .btn-stop { background:#f44336; color:white; }
  .btn:disabled { opacity:0.4; }
  #logs { background:#1a1a1a; height:300px; overflow-y:auto; padding:10px; font-family:monospace; font-size:13px; margin-top:20px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { padding:6px; border-bottom:1px solid #333; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <h2>Virtual‑Loss Trading (Tick‑Based)</h2>
  <div class="stat">
    <div>Balance: <span id="balance" class="big green">--</span></div>
    <div>Daily P&L: <span id="dailyPnl" class="big">--</span></div>
    <div id="lockReason" class="red" style="display:none;"></div>
  </div>

  <div>
    <button class="btn btn-start" id="startBtn" onclick="start()">Start</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stop()" disabled>Stop</button>
  </div>

  <h3>Market Status</h3>
  <table id="marketTable">
    <tr><th>Market</th><th>Mode</th><th>V.Losses</th><th>Cooldown</th><th>Conf</th><th>Trend</th></tr>
  </table>

  <h3>Logs</h3>
  <div id="logs"></div>
</div>

<script>
const es = new EventSource('/api/logs');
es.onmessage = e => {
  const data = JSON.parse(e.data);
  if (data.state) updateUI(data.state);
  if (data.logs) {
    const logDiv = document.getElementById('logs');
    data.logs.forEach(l => {
      const div = document.createElement('div');
      div.textContent = `[${new Date(l.time).toLocaleTimeString()}] ${l.message}`;
      logDiv.insertBefore(div, logDiv.firstChild);
    });
  }
};

function updateUI(s) {
  document.getElementById('balance').textContent = s.balance ? `${parseFloat(s.balance).toFixed(2)} ${s.currency}` : '--';
  document.getElementById('dailyPnl').textContent = s.dailyPnl ? `${s.dailyPnl.toFixed(2)} USD` : '0.00';
  document.getElementById('lockReason').textContent = s.lockReason || '';
  document.getElementById('lockReason').style.display = s.locked ? 'block' : 'none';
  document.getElementById('startBtn').disabled = s.active || s.sessionAlreadyUsedToday;
  document.getElementById('stopBtn').disabled = !s.active;

  const tbody = document.getElementById('marketTable');
  tbody.innerHTML = '<tr><th>Market</th><th>Mode</th><th>V.Losses</th><th>Cooldown</th><th>Conf</th><th>Trend</th></tr>';
  for (const sym of ['R_10','R_25','R_50','R_75','R_100']) {
    const ms = s.marketStates ? s.marketStates[sym] : null;
    const sig = s.marketSignals ? s.marketSignals[sym] : null;
    if (!ms) continue;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${sym}</td>
      <td>${ms.mode}</td>
      <td>${ms.virtualLosses}/${4}</td>
      <td>${ms.cooldownTicksLeft}</td>
      <td>${sig ? sig.overConf+'%' : '-'}</td>
      <td>${sig ? sig.trend : '-'}</td>
    `;
    tbody.appendChild(tr);
  }
}

function start() {
  fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'start'})});
}
function stop() {
  fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'stop'})});
}
</script>
</body>
</html>
