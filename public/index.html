<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deriv Trading Server</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
  .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .row { display: flex; flex-wrap: wrap; gap: 15px; margin: 12px 0; }
  .col { flex: 1; min-width: 200px; }
  label { display: block; font-weight: bold; margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 12px 24px; margin: 5px; cursor: pointer; font-weight: bold; border: none; border-radius: 4px; }
  .btn-start { background: #4CAF50; color: white; }
  .btn-stop { background: #f44336; color: white; }
  .btn-start:disabled, .btn-stop:disabled { opacity: 0.5; cursor: not-allowed; }
  .stats { display: flex; gap: 20px; margin: 15px 0; }
  .stat-box { flex: 1; background: #e3f2fd; padding: 12px; border-radius: 6px; text-align: center; }
  .stat-value { font-size: 24px; font-weight: bold; color: #1565c0; }
  .profit-positive { color: #2e7d32; }
  .profit-negative { color: #c62828; }
  #logs { background: #1e1e1e; color: #0f0; height: 320px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 13px; border-radius: 4px; }
  .log-entry { margin: 2px 0; border-bottom: 1px solid #333; padding: 2px 0; }
  .status { font-weight: bold; font-size: 18px; margin-bottom: 10px; }
  .status-running { color: #2e7d32; }
  .status-stopped { color: #c62828; }
</style>
</head>
<body>
<div class="container">
  <h2>Deriv Trading Server</h2>
  <div class="status">
    Status: <span id="serverStatus" class="status-stopped">Stopped</span>
    | Balance: <span id="balanceDisplay">--</span>
    | Running P/L: <span id="profitDisplay">0.00</span>
  </div>

  <div class="row">
    <div class="col">
      <label>Market Symbol</label>
      <select id="market">
        <option value="R_100">Volatility 100 (R_100)</option>
        <option value="R_75">Volatility 75 (R_75)</option>
        <option value="R_50">Volatility 50 (R_50)</option>
        <option value="R_25">Volatility 25 (R_25)</option>
        <option value="1HZ100V">Volatility 100 (1s)</option>
        <option value="BOOM1000">Boom 1000</option>
        <option value="CRASH1000">Crash 1000</option>
      </select>
    </div>
    <div class="col">
      <label>Trigger Digit (0-9)</label>
      <input type="number" id="digit" min="0" max="9" value="5">
    </div>
    <div class="col">
      <label>Direction</label>
      <select id="direction">
        <option value="CALL">CALL (Higher)</option>
        <option value="PUT">PUT (Lower)</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Barrier Offset</label>
      <input type="number" id="barrierOffset" step="0.01" value="1.0">
    </div>
    <div class="col">
      <label>Duration (ticks)</label>
      <input type="number" id="duration" value="1" min="1" max="10">
    </div>
    <div class="col">
      <label>Stake</label>
      <input type="number" id="stake" step="0.01" value="1.00">
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Martingale Multiplier</label>
      <input type="number" id="martingale" step="0.1" value="2.0">
    </div>
    <div class="col">
      <label>Take Profit</label>
      <input type="number" id="takeProfit" step="0.01" value="10.00">
    </div>
    <div class="col">
      <label>Stop Loss</label>
      <input type="number" id="stopLoss" step="0.01" value="10.00">
    </div>
  </div>

  <div>
    <button class="btn-start" id="startBtn" onclick="startTrading()">▶ Start Trading</button>
    <button class="btn-stop" id="stopBtn" onclick="stopTrading()" disabled>⏹ Stop Trading</button>
  </div>

  <h3>Trade Logs</h3>
  <div id="logs"></div>
</div>

<script>
const logDiv = document.getElementById('logs');

// SSE listener
const es = new EventSource('/api/logs');
es.onmessage = e => {
  const data = JSON.parse(e.data);
  if (data.logs) {
    data.logs.forEach(l => {
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.textContent = `[${new Date(l.time).toLocaleTimeString()}] ${l.message}`;
      logDiv.insertBefore(div, logDiv.firstChild);
      while (logDiv.children.length > 200) logDiv.removeChild(logDiv.lastChild);
    });
  }
  if (data.state) updateUI(data.state);
};

function updateUI(s) {
  const running = s.active;
  document.getElementById('serverStatus').textContent = running ? 'Running' : 'Stopped';
  document.getElementById('serverStatus').className = running ? 'status-running' : 'status-stopped';
  document.getElementById('startBtn').disabled = running;
  document.getElementById('stopBtn').disabled = !running;

  if (s.balance !== null && s.balance !== undefined) {
    document.getElementById('balanceDisplay').textContent = `${parseFloat(s.balance).toFixed(2)} ${s.currency}`;
  }

  const profit = parseFloat(s.runningProfit || s.totalProfit || 0);
  const profitEl = document.getElementById('profitDisplay');
  profitEl.textContent = profit.toFixed(2);
  profitEl.className = profit >= 0 ? 'profit-positive' : 'profit-negative';
}

// Fetch initial state
fetch('/api/state').then(r => r.json()).then(updateUI);

function startTrading() {
  const payload = {
    market: document.getElementById('market').value,
    digit: document.getElementById('digit').value,
    direction: document.getElementById('direction').value,
    barrierOffset: parseFloat(document.getElementById('barrierOffset').value),
    duration: parseInt(document.getElementById('duration').value),
    stake: parseFloat(document.getElementById('stake').value),
    martingale: parseFloat(document.getElementById('martingale').value),
    takeProfit: parseFloat(document.getElementById('takeProfit').value),
    stopLoss: parseFloat(document.getElementById('stopLoss').value)
  };
  fetch('/api/control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'update', ...payload })
  }).then(() => {
    return fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start' }) });
  }).then(r => r.json()).then(d => { if (d.error) alert(d.error); });
}

function stopTrading() {
  fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'stop' }) })
    .then(r => r.json()).then(d => { if (d.error) alert(d.error); });
}
</script>
</body>
</html>
